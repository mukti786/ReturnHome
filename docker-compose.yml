version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_APP_NAME=ReturnHome
      - VITE_APP_TAGLINE=From Missing to Found.
      - API_PROXY_TARGET=http://backend:5000
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/returnhome
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET to a unique random value of at least 32 characters}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - AI_SERVICE_URL=http://ai-service:8000
      - DEV_AUTH_BYPASS=false
    depends_on:
      - mongo
      - ai-service
    volumes:
      - backend_data:/app/backend/data
      - backend_uploads:/app/backend/uploads

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AI_ALLOWED_ORIGINS=http://backend:5000
    volumes:
      - backend_uploads:/backend/uploads

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  backend_data:
  backend_uploads:
